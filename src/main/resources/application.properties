spring.application.name=establecimiento-educacional
server.port=8080

# Conexion a MySQL (la base de datos se crea sola si no existe)
spring.datasource.url=jdbc:mysql://localhost:3306/bitacora_escolar?createDatabaseIfNotExist=true&serverTimezone=America/Santiago
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate: crea y actualiza las tablas a partir de las entidades
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
